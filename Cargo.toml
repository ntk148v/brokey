[package]
name = "brokey"
version = "0.1.0"
edition = "2021"

[dependencies]
ratatui = "0.29"
rdev = "0.5.3"
rodio = { version = "0.21", default-features = false, features = ["playback", "flac", "wav"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
dirs = "6"
ureq = { version = "2", default-features = false, features = ["tls"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"
opt-level = "s"

[dev-dependencies]
tempfile = "3"
